[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "draftsim"
version = "1.0.0"
description = "Fantasy football draft simulation, and a tool to draft against it"
requires-python = ">=3.11"
dependencies = [
    # Generator.spawn, which pick_sim uses to give each worker process an
    # independent stream, landed in numpy 1.25
    "numpy>=1.25",
    "scipy>=1.10",
    "pyarrow>=14",
]

[project.scripts]
draftsim = "draftsim.draft_tool:main"

[tool.setuptools]
packages = ["draftsim"]

[tool.setuptools.package-data]
draftsim = ["data/*.tsv", "data/*.csv"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "C90"]
ignore = [
    # Percent formatting is the house style here and it is used consistently
    # across every module, most often for column-aligned tables where the
    # format string is the layout. Rewriting ~80 of them as f-strings would
    # be churn that changes no behaviour and reads no better.
    "UP031",
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.isort]
known-first-party = ["draftsim"]
